[workspace]
members = ["crates/*", "src-tauri"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# No `panic = "abort"`: a panic in a service thread must not kill the whole app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
