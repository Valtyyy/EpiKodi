name: Setup Rust + Tauri deps
description: System packages (cached), Rust toolchain and shared frontend dist

inputs:
  components:
    description: Rust components to install
    default: ""

runs:
  using: composite
  steps:
    - uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev build-essential pkg-config
        version: 1.0

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    # tauri::generate_context! needs frontendDist at compile time.
    - uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist
