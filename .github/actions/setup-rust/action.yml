name: Setup Rust + Tauri deps
description: System packages, Rust toolchain and shared frontend dist

inputs:
  components:
    description: Rust components to install
    default: ""

runs:
  using: composite
  steps:
    - name: Install Tauri system dependencies
      shell: bash
      run: |
        # Retries: runners occasionally fail DNS resolution on the Ubuntu mirrors
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
        for i in 1 2 3; do sudo apt-get $APT_OPTS update && break || sleep 10; done
        sudo apt-get $APT_OPTS install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev pkg-config

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    # tauri::generate_context! needs frontendDist (ui/tv/dist) at compile time,
    # and ui/remote/dist will be embedded by rust-embed. The artifact is rooted
    # at ui/ (common ancestor of both dist folders).
    - uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ui
