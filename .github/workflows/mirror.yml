name: Mirror

# Mirrors the repository to the Epitech repository.
# Requires the repository secret MIRROR_SSH_PRIVATE_KEY: private half of a
# deploy key (with write access) registered on the mirror repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push to mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
        with:
          # The source repository is public, no credentials needed to clone it.
          source-repo: https://github.com/Valtyyy/EpiKodi.git
          destination-repo: git@github.com:EpitechPGE3-2026/G-PRO-500-PAR-5-1-professionalwork-51.git
