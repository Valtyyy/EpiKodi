name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # tauri::generate_context! needs frontendDist at compile time.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Compiles every dependency once (build + check mode) and shares target/
  # with the clippy and test jobs.
  build:
    name: Build Rust deps
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache across runs; the artifact below shares it across jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compile (build mode, used by tests)
        working-directory: src-tauri
        run: cargo test --all-features --no-run

      - name: Compile (check mode, used by clippy)
        working-directory: src-tauri
        run: cargo check --all-targets --all-features

      - uses: actions/upload-artifact@v4
        with:
          name: rust-target
          path: src-tauri/target
          include-hidden-files: true # .fingerprint is a hidden dir
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  clippy:
    name: Clippy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: rust-target
          path: src-tauri/target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: rust-target
          path: src-tauri/target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-features
