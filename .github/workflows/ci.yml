name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0 # much smaller target/, faster builds

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            ui/tv/dist
            ui/remote/dist
          if-no-files-found: error
          retention-days: 1

  # Compiles every dependency once (build + check mode) and shares target/
  # with the clippy and test jobs.
  build:
    name: Build Rust deps
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      # Cache across runs; the artifact below shares it across jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Compile (build mode, used by tests)
        run: cargo test --workspace --all-features --no-run

      - name: Compile (check mode, used by clippy)
        run: cargo check --workspace --all-targets --all-features

      # upload-artifact drops permissions (build scripts lose +x), so ship a
      # tarball, which also keeps mtimes so cargo sees everything as fresh.
      - name: Pack target
        run: tar -I 'zstd -T0 -3' -cf target.tar.zst target

      - uses: actions/upload-artifact@v4
        with:
          name: rust-target
          path: target.tar.zst
          compression-level: 0 # already compressed
          if-no-files-found: error
          retention-days: 1

  clippy:
    name: Clippy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - uses: actions/download-artifact@v4
        with:
          name: rust-target

      - name: Unpack target
        run: tar -I zstd -xf target.tar.zst

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - uses: actions/download-artifact@v4
        with:
          name: rust-target

      - name: Unpack target
        run: tar -I zstd -xf target.tar.zst

      - name: Tests
        run: cargo test --workspace --all-features
