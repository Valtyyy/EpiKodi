[package]
name = "smb-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of the root workspace.
[workspace]

[dependencies]
smb = "0.12"
smb-fscc = "0.12"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
