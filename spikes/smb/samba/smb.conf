[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   log file = /var/log/samba/log.%m
   max log size = 1000
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[secure]
   path = /data
   read only = yes
   valid users = tester
   guest ok = no

[public]
   path = /data
   read only = yes
   guest ok = yes
