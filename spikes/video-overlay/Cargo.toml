[package]
name = "video-overlay-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike 2.1: transparent WebKitGTK webview over a libmpv GtkGLArea (Tauri 2)"

# Standalone crate: never part of the root workspace.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
gdk-sys = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
libmpv2 = "7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
debug = false
